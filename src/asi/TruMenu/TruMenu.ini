[Sound]
; 0.20.1 (snd.list): 1 = the sound list from the start - every voice the game plays (group, wave / stream, volume, state,
; distance to Lara), built on the game thread from the voice pool 0x8a8108; snd.dump writes it into TruMenu.log
List=0
; 0.20.1 (snd.pos): corner of the sound list - bl bottom left, tl top left, tr top right, br bottom right (0.21 default: br - bottom left
; is the quick-toggle bar's side; in a right corner the rows are right-aligned)
Position=br
; 0.20.1 (snd.lines): lines of the sound list below its header, 1 .. 40
MaxLines=16
; 0.20.1 (snd.refresh): one walk of the voice pool every n ms, 100 .. 10000
RefreshMs=1000
; 0.20.1 (snd.sort): group (music, SFX, speech, other; then the group number), volume or name (streams, then the wave id)
Sort=group
; 0.20.1 (snd.scale): font scale of the sound list, 0.5 .. 3
FontScale=1.0
; 0.20.1 (snd.playing): 1 = only audible voices; 0 = also paused, muted, virtual, starting and ending ones (dimmed)
OnlyPlaying=0
; 0.20.1 (snd.music): music lines (the groups of the music slider and of the channel group 'music')
ShowMusic=1
; 0.20.1 (snd.sfx): SFX lines (the group of the effects slider)
ShowSfx=1
; 0.20.1 (snd.speech): speech lines (the group of the third slider - speech / cutscenes)
ShowSpeech=1
; 0.20.1 (snd.other): lines of voices in no known group
ShowOther=1
; 0.22.45 (snd.wavelog on / off): 1 = one TruMenu.log line 'snd.wave <id> START' whenever a voice of a wave in WaveIds
; starts - unit, voice, group, volume, emitter + SoundPlex section, the object whose sound list holds it, the
; wave table entry (W6 hearing test of wave 10 = ui_drop_04 / the DLC 2 reuse)
WaveLog=1
; 0.22.45 (snd.wavelog <ids>): the waves of WaveLog, decimal 0 .. 5119, at most 8 (space or comma between)
WaveIds=10
; 0.22.45: at most n 'snd.wave' lines per game start (0 = no limit); further starts are only counted (snd.mutes)
WaveLogMax=500
; 0.22.47 (snd.history): 1 = keep the newest sound starts (time, name, group, source) for the bar's sound monitor
; and the log overlay; 0 = off (the voice pool is then walked only for the other sound switches)
History=1
; 0.22.47: starts shown in the bar / the log overlay / snd.history, 1 .. 200
HistoryMax=30
; 0.22.47: 1 = one TruMenu.log line 'snd.start #n' per sound start (at most 5000 per game start)
HistoryLog=0
; 0.22.47 (snd.logview): the snd.list box as 1 = a log (newest start on top, colour + icon per kind,
; older lines fade), 0 = the 0.20.1 list of the voices now; written back by the bar
OverlayStyle=1
; 0.22.47: a log line fades over n seconds and goes after 4 x n (0 = never fade), 0 .. 600
LogFadeSec=15
; 0.22.47 (snd.sonar / snd.sonar57): 1 = Sonar-Ton aus - only the waves of SonarWaves muted per channel
; whenever they play (also after a level load / each new sonar open); 2 = fallback, the whole group 57
; (PDA - its child group 70 = Lara's hint lines go too); 0 = off; written back by the bar
SonarMute=0
; 0.22.47: the sonar waves of SonarMute=1 (g_pda.drm: 914 / 915 computer_hum = the loop, section 3381;
; 916 alrm_radar_03 = the ping, section 3382), decimal, at most 8
SonarWaves=914 915 916
; 0.22.50: 1 = the two small code redirects that name a sound's source exactly: 0x591351 (voice -> emitter of
; the wave node) and 0x5b99fc (emitter -> instance of the anim event); written on the game thread only over
; the game's bytes, put back at unload; 0 = the owner list only. Read at the start
SourceHooks=1
; 0.22.50 (snd.logcat lara): the sound box shows Lara's voice / body / gear sounds (0.22.53: the weapons are
; their own kind, LogWeapons). Live
LogLara=1
; 0.22.50 (snd.logcat enemies): enemies and creatures. Live
LogEnemies=1
; 0.22.50 (snd.logcat world): world and ambience (groups 14 .. 24 and the effect nodes). Live
LogWorld=1
; 0.22.50 (snd.logcat objects): objects, mechanisms, traps, debris, explosions. Live
LogObjects=1
; 0.22.50 (snd.logcat ui): HUD, menu, PDA / sonar, binoculars. Live
LogUi=1
; 0.22.50 (snd.logcat speech): speech - Lara's voice and hints, radio, cutscenes. Live
LogSpeech=1
; 0.22.50 (snd.logcat music): music voices and streams. Live
LogMusic=1
; 0.22.53 (snd.logcat weapons): weapons - draw / cock, shots, reload & grenades, brass, impacts, and Lara's
; weapon sounds without a group (g14). Live
LogWeapons=1
; 0.22.53 (snd.logsub <key> 0|1): the sub-groups the sound box hides, a comma list of keys (lara_voice,
; wp_shot, ...; snd.hear lists them); empty = every sub-group shown. Live
LogHideSubs=
; 0.22.53 (snd.logfollow, 'Filter folgt Stumm'): 1 = what Stumm / Solo silences (TruMenu's kind / sub-group
; rules, the solo) is not shown in the box either; 0 = muted sounds stay in the log. Unlike LogOnlyAudible
; (FMOD's state now, whoever muted it, and silent lines), this follows TruMenu's own switches. Live
LogFollowMute=1
; 0.22.50 (snd.logaudible): 1 = the box hides lines FMOD mutes or pauses (ChannelI +0x74 bit 3 / real +0x68 0x20). Live
LogOnlyAudible=0
; 0.22.50 (snd.logcollapse): 1 = same wave + same source = one line with xn and the newest time, moving to
; the top on every new start; 0 = one line per start. Live
LogCollapse=1
; 0.22.50 (snd.logdist): the box hides 3D sounds farther from Lara than n metres, 0 = every distance, 0 .. 500. Live
LogMaxDist=0
; 0.22.51 (snd.reverbmute, 'Hall folgt Stumm'): 1 = a voice FMOD has muted also sends nothing into the game's own reverb
; (two call redirects 0x591591 / 0x5841bf of the send level setMix; the game feeds every voice into it and
; FMOD's mute does not reach that path); 0 = the game's (muted sounds keep their reverb). Live
ReverbFollowsMute=1
