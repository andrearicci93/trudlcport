; TruFlashShadow 0.5 - D-2 test: flashlight chest spot light casts its shadow (PC)
[FlashShadow]
; 1 = active, 0 = load but patch nothing
Enabled=1
; 1 = also mark the flashlight light instance "visible this frame" before the shadow pass
ForceVisible=0
; 1 = put the flashlight light into the shadow-casting list the game hands the renderer
AddToShadowList=1
; 1 = also add the flashlight to the shadow list of draws whose light list does not contain it (test)
AddToAllShadowLists=1
; 1 = level geometry the data marks as non-casting also casts, for the flashlight only
StaticAllCast=1
; 1 = level terrain (pole, beams, steps) casts for the flashlight: flashlight bit set in every terrain part mask
TerrainCast=1
; 1 = log counters every 120 frames (SetLights / static caster batches with the flashlight)
Diagnostics=1
; 0 errors, 1 info (first frame per light), 2 every frame
LogLevel=1
