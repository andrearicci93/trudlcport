[Sonar]
; 0.22.48 (sonar.full): 1 = Sonar komplett - the PDA sonar draws every face of the loaded, placed map units of the
; floor, not only what the ping revealed; display only (3 patches in the draw 0x6e3a00), the reveal state
; in the save is not touched; 0 = the game's map (its own bytes). Live (read about once a second)
FullMap=0
; 0.22.48 (sonar.placeholder): with FullMap=1: 1 = the placeholder mesh of units without a map (100 faces / 56
; vertices: the big 3D letters MAP in DLC 2, dlc_level1_start, dlc_treasureroom) is not drawn; 0 = drawn.
; With FullMap=0 the game's code (no hook). Live
HidePlaceholder=1
; 0.22.48 (sonar.markers): with FullMap=1: 1 = every stair / floor-change marker of the loaded units, not only
; the ones a ping saw (0x6e40c6); 0 = the game's. Live
FloorMarkers=0
; 0.22.49 (sonar.allfloors): with FullMap=1: 1 = the sonar also draws the map units of other floors it loaded
; itself (the direct neighbours of the floor, 0x6e429b); no extra load, display only; 0 = the game's
; floor test. Live
AllFloors=0
; 0.22.53 (sonar.loadnb): with FullMap=1: 1 = the sonar loads one step further than the game - the neighbours
; of every neighbour it loaded on another floor (0 .. 5 more map units); shown with AllFloors=1. Released at
; the close like the game's. Read once a second, acts at the next open
LoadNeighbourFloors=0
; 0.22.53 (sonar.loadall): with FullMap=1: 1 = every portal-connected map unit of the level (all floors,
; recursive; up to 22 units / 16 MB, + 0 .. 2 s at the open); wins over LoadNeighbourFloors. Released at
; the close. Read once a second, acts at the next open
LoadAllConnected=0
; 0.22.53: at most this many extra map units per open (1 .. 64); a load also stops when the loaded faces
; reach TriangleCap. Read once a second
LoadMaxUnits=24
; 0.22.49: with FullMap=1: the sonar's per-frame triangle budget (0x6dfa69, the game's 93572); values up to 93572 = the
; game's bytes, at most 1000000. A budget only: the triangles go out in batches of 2000 into the render
; device's growing vertex pool (84 bytes each). Live
TriangleCap=300000
; 0.22.51 / 0.22.52 (sonar.fade, 'Sonar: Abblenden Ferne'): the dimming of far map parts. It is the face shader's
; (materials 3348 / 3349, PS lib 192): a 1/d falloff to half and a fade to black (game: 200 .. 600 m).
; 0 = the game's; n = 1 .. 2000 metres: no falloff, black from n/2 to n m; -1 = aus (no falloff, no fade).
; Every value != 0 also puts the fog out (call redirects 0x6e4d94 / 0x6e4bf9). Live
